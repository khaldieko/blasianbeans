  <style>
    :root {
      --bg-1: #0c0520;
      --bg-2: #1a0a4a;
      --bg-3: #0a1848;
      --card: rgba(18, 10, 42, 0.55);
      --text: #f7f4ff;
      --muted: #c9bde8;
      --gold: #ffd166;
      --glow: rgba(124, 58, 237, 0.55);
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 10% -10%, rgba(124, 58, 237, 0.45), transparent 55%),
        radial-gradient(900px 600px at 110% 10%, rgba(56, 189, 248, 0.28), transparent 50%),
        radial-gradient(800px 500px at 50% 120%, rgba(255, 209, 102, 0.12), transparent 50%),
        linear-gradient(165deg, var(--bg-1), var(--bg-2) 45%, var(--bg-3));
      background-attachment: fixed;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 32px 20px 28px;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.18) 0 1px, transparent 1.5px),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.14) 0 1px, transparent 1.5px),
        radial-gradient(circle at 60% 70%, rgba(255,255,255,0.1) 0 1px, transparent 1.5px),
        radial-gradient(circle at 30% 85%, rgba(255,255,255,0.12) 0 1px, transparent 1.5px);
      background-size: 220px 220px, 180px 180px, 260px 260px, 200px 200px;
      opacity: 0.7;
      z-index: 0;
    }

    .page {
      width: min(420px, 100%);
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar {
      width: 104px;
      height: 104px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #8b5cf6, #38bdf8);
      box-shadow:
        0 0 0 4px rgba(255,255,255,0.12),
        0 0 32px rgba(124, 58, 237, 0.7),
        0 10px 24px rgba(0,0,0,0.35);
      position: relative;
    }

    .avatar span {
      font-family: "Fredoka", "Nunito", sans-serif;
      font-weight: 700;
      font-size: 36px;
      letter-spacing: 0.04em;
      color: #fff;
      text-shadow: 0 2px 0 rgba(0,0,0,0.18);
    }

    .avatar::after {
      content: "🎮";
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      font-size: 16px;
      background: #1b0d3a;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(255,209,102,0.85);
    }

    h1 {
      font-family: "Fredoka", "Nunito", sans-serif;
      font-weight: 700;
      font-size: clamp(1.7rem, 7vw, 2.15rem);
      letter-spacing: 0.01em;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .tagline {
      color: var(--muted);
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.45;
      max-width: 22rem;
      margin: 0 auto;
    }

    .live-note {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(254, 44, 85, 0.16);
      border: 1px solid rgba(254, 44, 85, 0.4);
      color: #ffd7e0;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fe2c55;
      box-shadow: 0 0 0 0 rgba(254, 44, 85, 0.7);
      animation: pulse 1.6s ease-out infinite;
    }

    @keyframes pulse {
      70% { box-shadow: 0 0 0 8px rgba(254, 44, 85, 0); }
      100% { box-shadow: 0 0 0 0 rgba(254, 44, 85, 0); }
    }

    nav {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 62px;
      padding: 12px 16px;
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--text);
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.22);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .link:hover,
    .link:focus-visible {
      transform: translateY(-2px) scale(1.015);
      outline: none;
    }

    .icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
    }

    .icon svg {
      width: 22px;
      height: 22px;
      display: block;
      fill: currentColor;
    }

    .copy {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
      flex: 1;
    }

    .copy strong {
      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .copy span {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
    }

    .badge {
      margin-left: auto;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: #fe2c55;
      padding: 4px 8px;
      border-radius: 999px;
      box-shadow: 0 0 14px rgba(254, 44, 85, 0.6);
    }

    .tiktok:hover, .tiktok:focus-visible {
      border-color: rgba(254, 44, 85, 0.7);
      box-shadow: 0 0 0 1px rgba(254, 44, 85, 0.35), 0 10px 28px rgba(254, 44, 85, 0.35);
    }
    .tiktok .icon { background: #111; color: #fff; box-shadow: 0 0 16px rgba(254, 44, 85, 0.45); }

    .youtube:hover, .youtube:focus-visible {
      border-color: rgba(255, 0, 0, 0.7);
      box-shadow: 0 0 0 1px rgba(255, 0, 0, 0.3), 0 10px 28px rgba(255, 0, 0, 0.32);
    }
    .youtube .icon { background: #ff0000; color: #fff; box-shadow: 0 0 16px rgba(255, 0, 0, 0.45); }

    .twitch:hover, .twitch:focus-visible {
      border-color: rgba(145, 70, 255, 0.8);
      box-shadow: 0 0 0 1px rgba(145, 70, 255, 0.35), 0 10px 28px rgba(145, 70, 255, 0.38);
    }
    .twitch .icon { background: #9146ff; color: #fff; box-shadow: 0 0 16px rgba(145, 70, 255, 0.5); }

    .kick:hover, .kick:focus-visible {
      border-color: rgba(83, 252, 24, 0.7);
      box-shadow: 0 0 0 1px rgba(83, 252, 24, 0.3), 0 10px 28px rgba(83, 252, 24, 0.22);
    }
    .kick .icon { background: #53fc18; color: #0b1208; box-shadow: 0 0 16px rgba(83, 252, 24, 0.45); }

    .instagram:hover, .instagram:focus-visible {
      border-color: rgba(225, 48, 108, 0.7);
      box-shadow: 0 0 0 1px rgba(225, 48, 108, 0.3), 0 10px 28px rgba(225, 48, 108, 0.32);
    }
    .instagram .icon {
      color: #fff;
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%);
      box-shadow: 0 0 16px rgba(214, 36, 159, 0.5);
    }

    .x:hover, .x:focus-visible {
      border-color: rgba(255,255,255,0.5);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.2), 0 10px 28px rgba(0,0,0,0.45);
    }
    .x .icon { background: #000; color: #fff; box-shadow: 0 0 16px rgba(255,255,255,0.18); }

    footer {
      margin-top: 28px;
      text-align: center;
      color: #a899d0;
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.5;
    }

    footer p + p { margin-top: 2px; opacity: 0.85; }
  </style>
</head>
